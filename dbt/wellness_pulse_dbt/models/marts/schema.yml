version: 2

models:
  - name: dim_users
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: dim_content
    columns:
      - name: content_id
        tests:
          - not_null
          - unique

  - name: fact_user_daily
    columns:
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id

      - name: event_date
        tests:
          - not_null

  - name: fact_content_engagement_daily
    columns:
      - name: content_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_content')
              field: content_id
